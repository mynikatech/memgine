# Environment-neutral Liquibase configuration template.
# Supply appSchemaName, url, username and password securely per environment.
changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml
defaultSchemaName=${appSchemaName}
liquibaseSchemaName=${appSchemaName}
classpath=src/main/resources
liquibase.hub.mode=off
logLevel=info
