ktor {
  deployment {
    host = "0.0.0.0"
    port = 8080
  }
}

memgine {
  server {
    # Local development can remain HTTP. DEV/PROD should terminate TLS at the
    # reverse proxy/load balancer and set MEMGINE_ENFORCE_HTTPS=true.
    enforceHttps = false
    environment = "local"
  }

  authentication {
    sessionDurationMinutes = 480
    customerSessionDurationDays = 30
    posDeviceCookieName = "memgine_pos_device"
    posDeviceCookieDays = 365
    posPinMaxAttempts = 5
    posPinLockMinutes = 15
    cookieName = "memgine_session"
    passwordMinimumLength = 12
  }

  otp {
    # DEV is rejected unless MEMGINE_ENVIRONMENT is local/dev/development.
    provider = "DEV"
    ttlSeconds = 300
    cooldownSeconds = 60
    maxAttempts = 5
    allowedRegions = "CA,IN"
    awsRegion = "ca-central-1"
    notificationEventsTopicArn = "arn:aws:sns:ca-central-1:482762107384:memgine-dev-notification-events"
  }

  payment {
    # Set MEMGINE_PAYMENT_PROVIDER=STRIPE together with STRIPE_SECRET_KEY,
    # STRIPE_WEBHOOK_SECRET, and MEMGINE_WEB_BASE_URL to enable Stripe Checkout.
    provider = "TEST"
    webBaseUrl = ""
    # MONERIS uses runtime-only MONERIS_CLIENT_ID, MONERIS_CLIENT_SECRET,
    # MONERIS_MERCHANT_ID, and MONERIS_HOSTED_TOKENIZATION_PROFILE_ID.
    monerisBaseUrl = "https://api.sb.moneris.io"
    monerisApiVersion = "2026-08-14"
    monerisHostedTokenizationUrl = "https://esqa.moneris.com/HPPtoken/index.php"
  }

  database {
    # Secrets are intentionally NOT stored here.
    # Supply these as environment variables:
    # MEMGINE_DB_URL
    # MEMGINE_DB_USER
    # MEMGINE_DB_PASSWORD
    schema = "memginedev"
    maximumPoolSize = 10
  }
}
