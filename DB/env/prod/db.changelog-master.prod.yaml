databaseChangeLog:
  - property:
      name: schemaName
      value: memgine

  - property:
      name: appRole
      value: memgine_app

  - property:
      name: poyntCredentialProfileSeedEnabled
      value: "true"
  - property:
      name: poyntCredentialProfileSeedId
      value: POYNT-CRED-PROD-001
  - property:
      name: poyntCredentialProfileSeedDisplayName
      value: Primary Poynt Production Cloud App
  - property:
      name: poyntCredentialProfileSeedSecretReference
      value: memgine/prod/poynt/cloud-app

  - include:
      file: ../../liquibase/baseline/000-initial-baseline.yaml
      relativeToChangelogFile: true

  - includeAll:
      path: ../../liquibase/changes
      relativeToChangelogFile: true
