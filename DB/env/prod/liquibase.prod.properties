# AWS PROD Liquibase configuration template.
# Supply URL/credentials through the deployment environment.
url=jdbc:postgresql://<PROD-ENDPOINT>:5432/memgine
username=memgine_user
defaultSchemaName=memgine
liquibase.liquibaseSchemaName=memgine
liquibase.hub.mode=off
logLevel=info
changeLogFile=db/changelog/db.changelog-master.yaml
classpath=src/main/resources