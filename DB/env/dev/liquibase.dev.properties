# AWS DEV Liquibase configuration template.
# Supply URL/credentials through the deployment environment.
url=jdbc:postgresql://<DEV-ENDPOINT>:5432/memgine_dev
username=memgine_dev_user
defaultSchemaName=memginedev
liquibase.liquibaseSchemaName=memginedev
liquibase.hub.mode=off
logLevel=info
changeLogFile=db/changelog/db.changelog-master.yaml
classpath=src/main/resources
